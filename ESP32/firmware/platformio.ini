; PlatformIO project configuration for SCUD reader firmware
; См. docs/02_firmware_spec (1).md §3.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_FREERTOS_HZ=1000
    -I include

lib_deps =
    Wire
    ; PN532 (core + HSU transport) подложены в lib/ из elechouse/PN532,
    ; т.к. репозиторий — монорепа с несколькими библиотеками в подпапках
    ; и LDF PlatformIO не умеет выбрать нужную при прямом клоне.
    adafruit/RTClib@^2.1.1
    ; NimBLE — лёгкая (≈70 KB flash) BLE-стек для ESP32. Используется только в
    ; env esp32dev_ble (опциональный BLE-канал shared §16). Linkage линкует код
    ; в финальный бинарь только при SCUD_BLE_ENABLED=1 — иначе ble/* модули
    ; компилируются в "no-op" заглушки и NimBLE не подтягивается LDF.
    h2zero/NimBLE-Arduino@^1.4.1

monitor_filters = esp32_exception_decoder


; ============================================================================
; Альтернативный env с BLE-каналом (shared §16). Включается для шлагбаумов,
; турникетов и других mains-powered устройств. На battery конфигурации
; **никогда не используется** — BLE radio убивает автономность.
; Build:  pio run -e esp32dev_ble
; ============================================================================
[env:esp32dev_ble]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSCUD_BLE_ENABLED=1
