name: android

on:
  push:
    paths:
      - 'AndroidApp/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'AndroidApp/**'
      - '.github/workflows/android.yml'

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: AndroidApp
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            AndroidApp/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('AndroidApp/**/*.gradle*', 'AndroidApp/**/gradle-wrapper.properties', 'AndroidApp/gradle/**') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # local.properties в репо не закоммичен; для CI создаём минимальный
      # с sdk.dir = $ANDROID_SDK_ROOT (используется setup-android-action или дефолт runner).
      - name: Prepare local.properties
        run: |
          if [ ! -f local.properties ]; then
            echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      # Gating: JVM unit tests incl. the cross-impl conformance vectors
      # (ConformanceVectorsTest) + CryptoTest/SerializationTest.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Lint (advisory)
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: AndroidApp/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
