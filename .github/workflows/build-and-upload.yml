# Build & upload all SCUD artifacts on push to main and on manual dispatch.
#
# This is the "release-style" aggregate workflow: it builds every component and
# uploads the resulting artifacts. Per-component path-filtered CI (android.yml,
# backend.yml, firmware.yml) still runs the gating tests on every push/PR — this
# file is intentionally scoped to main + manual runs so the four artifacts
# (APK, two firmware .bin, backend Docker smoke, desktop build) land together.
name: build-and-upload

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel a superseded run (e.g. rapid pushes to main) so only the latest builds.
concurrency:
  group: build-and-upload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Android debug APK (no keystore required — debug signing config only).
  # ---------------------------------------------------------------------------
  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AndroidApp
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            AndroidApp/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('AndroidApp/**/*.gradle*', 'AndroidApp/**/gradle-wrapper.properties', 'AndroidApp/gradle/**') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # local.properties is not committed; point sdk.dir at the runner SDK.
      - name: Prepare local.properties
        run: |
          if [ ! -f local.properties ]; then
            echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug
          path: AndroidApp/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. ESP32 firmware — both envs (NFC-only + BLE), one .bin each.
  # ---------------------------------------------------------------------------
  esp32-firmware:
    name: ESP32 firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, esp32dev_ble]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO core + packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ESP32/firmware/.pio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('ESP32/firmware/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.env }}-
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware (${{ matrix.env }})
        run: pio run -d ESP32/firmware -e ${{ matrix.env }}

      # Rename per env so the two artifacts don't collide on download.
      - name: Rename firmware.bin per env
        run: cp ESP32/firmware/.pio/build/${{ matrix.env }}/firmware.bin firmware-${{ matrix.env }}.bin

      - name: Upload firmware .bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: firmware-${{ matrix.env }}.bin
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Backend — pytest (SQLite default) + Docker image build smoke (no push).
  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests + Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'Backend/pyproject.toml'

      - name: Install system libs (libsodium for PyNaCl)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsodium23

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (SQLite default)
        run: pytest -q

      # Smoke-build the multistage image to prove the Dockerfile is valid.
      # No push — just confirm it builds.
      - name: Build backend Docker image (smoke, no push)
        run: docker build -t scud-backend:ci .

  # ---------------------------------------------------------------------------
  # 4. Desktop (.NET MAUI / Windows) — best-effort: a flaky maui-windows
  #    workload install must not fail the whole run.
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop ScudProvisioner (best-effort)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Build ScudProvisioner (Release)
        run: dotnet build Desktop/ScudProvisioner -c Release

      - name: Upload desktop build output
        uses: actions/upload-artifact@v4
        with:
          name: desktop-scudprovisioner
          path: Desktop/ScudProvisioner/bin/Release/**
          retention-days: 14
          if-no-files-found: warn
