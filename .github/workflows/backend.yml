name: backend

on:
  push:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'Backend/pyproject.toml'

      - name: Install system libs (libsodium for PyNaCl)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsodium23

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q --tb=short

      - name: Ruff lint (advisory — не блокирует)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check src

  # TESTIN-03: exercise Postgres-only concurrency semantics (FOR UPDATE SKIP
  # LOCKED, row-locks, JSONB) that the sqlite `test` job cannot. Runs only the
  # @pytest.mark.postgres subset against a real Postgres 15 service.
  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: scud
          POSTGRES_PASSWORD: scud
          POSTGRES_DB: scud_test
        ports:
          - 5432:5432
        # Wait until Postgres is ready before the job steps run.
        options: >-
          --health-cmd "pg_isready -U scud -d scud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # asyncpg URL — used by the test engine (conftest) AND alembic (env.py
      # reads DATABASE_URL). Both point at the service container on localhost.
      SCUD_TEST_DATABASE_URL: postgresql+asyncpg://scud:scud@localhost:5432/scud_test
      DATABASE_URL: postgresql+asyncpg://scud:scud@localhost:5432/scud_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'Backend/pyproject.toml'

      - name: Install system libs (libsodium for PyNaCl)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsodium23

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations (alembic upgrade head)
        run: alembic upgrade head

      - name: Run Postgres-marked concurrency tests
        run: pytest -m postgres -q --tb=short

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Сборка image без push — проверяем что multistage Dockerfile валиден.
      # Push в registry — отдельный job в release-workflow (пока не нужен для CI).
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: Backend
          push: false
          tags: scud-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
