# Production-friendly nginx config для SCUD backend.
#
# Делает: TLS termination, rate-limit /auth, gzip, прокидывает X-Forwarded-*
# (uvicorn запущен с --proxy-headers, чтобы это уважать).
#
# Подключение:
#   - сертификаты лежат в /etc/nginx/certs/{fullchain.pem, privkey.pem}
#     (volume-bind: ./deploy/certs/:/etc/nginx/certs:ro);
#   - в prod рекомендуется LE через side-car certbot или внешнюю автоматизацию.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    # Rate-limit логин/auth (10 req/min/IP), общий — щедрее.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=120r/m;

    upstream scud_api {
        # Compose сам резолвит и round-robin'ит несколько replicas.
        server app:8000;
        keepalive 32;
    }

    # HTTP → HTTPS redirect.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # Health-check проксируем без rate-limit'а (нужен для load balancer'а).
        location = /health {
            proxy_pass http://scud_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        location /api/v1/app/auth {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://scud_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://scud_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            client_max_body_size 4m;
        }
    }
}
