{% extends "base.html" %}
{% block title %}Новая группа{% endblock %}
{% block content %}
<div class="max-w-xl">
    <h1 class="text-2xl font-semibold mb-2">Новая группа ридеров</h1>
    <a href="/admin/reader-groups" class="text-sm text-blue-600 hover:underline">← К списку</a>
    <form method="post" action="/admin/reader-groups" class="bg-white rounded-lg shadow p-6 mt-4 space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">Название</label>
            <input name="name" required maxlength="128"
                   class="w-full px-3 py-2 border border-slate-300 rounded text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Описание</label>
            <textarea name="description" rows="3"
                      class="w-full px-3 py-2 border border-slate-300 rounded text-sm"></textarea>
        </div>
        <button class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded font-medium">Создать</button>
    </form>
</div>
{% endblock %}
